name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build
      
      - name: Unit tests
        run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d
      
      - name: Check Docker containers status
        run: |
          echo "=== Docker containers status ==="
          docker ps -a
          echo ""
          echo "=== Docker compose services ==="
          docker compose -f docker-compose.test.yml ps
      
      - name: Wait for services
        run: |
          echo "Waiting for Pinchtab to be ready..."
          for i in {1..60}; do
            if curl -s -H "Authorization: Bearer test-token" http://127.0.0.1:19867/health | grep -q '"status":"ok"'; then
              echo "Pinchtab is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - waiting..."
            sleep 1
          done
          echo "Timeout waiting for Pinchtab"
          echo ""
          echo "=== Docker diagnostics on failure ==="
          echo "=== Docker compose logs ==="
          docker compose -f docker-compose.test.yml logs
          echo ""
          echo "=== Docker containers status ==="
          docker ps -a
          exit 1
      
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Pinchtab service logs ==="
          docker compose -f docker-compose.test.yml logs pinchtab
          echo ""
          echo "=== All service logs ==="
          docker compose -f docker-compose.test.yml logs
      
      - name: Build test files
        run: npm run build:test
      
      - name: Integration tests (stdio)
        run: node --test dist-test/tests/integration/pinchtab.integration.test.js
        env:
          PINCHTAB_URL: http://127.0.0.1:19867
          PINCHTAB_TOKEN: test-token
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down

  integration-http:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d
      
      - name: Check Docker containers status
        run: |
          echo "=== Docker containers status ==="
          docker ps -a
          echo ""
          echo "=== Docker compose services ==="
          docker compose -f docker-compose.test.yml ps
      
      - name: Wait for Pinchtab
        run: |
          echo "Waiting for Pinchtab to be ready..."
          for i in {1..60}; do
            if curl -s -H "Authorization: Bearer test-token" http://127.0.0.1:19867/health | grep -q '"status":"ok"'; then
              echo "Pinchtab is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - waiting..."
            sleep 1
          done
          echo "Timeout waiting for Pinchtab"
          echo ""
          echo "=== Docker diagnostics on failure ==="
          echo "=== Docker compose logs ==="
          docker compose -f docker-compose.test.yml logs
          echo ""
          echo "=== Docker containers status ==="
          docker ps -a
          exit 1
      
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Pinchtab service logs ==="
          docker compose -f docker-compose.test.yml logs pinchtab
          echo ""
          echo "=== All service logs ==="
          docker compose -f docker-compose.test.yml logs
      
      - name: Build test files
        run: npm run build:test
      
      - name: Integration tests (Streamable HTTP)
        run: node --test dist-test/tests/integration/streamable-http.integration.test.js
        env:
          PINCHTAB_URL: http://127.0.0.1:19867
          PINCHTAB_TOKEN: test-token
          MCP_HTTP_PORT: 13000
          MCP_AUTH_TOKEN: mcp-test-token
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down

  e2e:
    runs-on: ubuntu-latest
    needs: [build, integration]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build all
        run: npm run build && npm run build:test
      
      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d
      
      - name: Check Docker containers status
        run: |
          echo "=== Docker containers status ==="
          docker ps -a
          echo ""
          echo "=== Docker compose services ==="
          docker compose -f docker-compose.test.yml ps
      
      - name: Wait for Pinchtab
        run: |
          echo "Waiting for Pinchtab to be ready..."
          for i in {1..60}; do
            if curl -s -H "Authorization: Bearer test-token" http://127.0.0.1:19867/health | grep -q '"status":"ok"'; then
              echo "Pinchtab is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - waiting..."
            sleep 1
          done
          echo "Timeout waiting for Pinchtab"
          echo ""
          echo "=== Docker diagnostics on failure ==="
          echo "=== Docker compose logs ==="
          docker compose -f docker-compose.test.yml logs
          echo ""
          echo "=== Docker containers status ==="
          docker ps -a
          exit 1
      
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Pinchtab service logs ==="
          docker compose -f docker-compose.test.yml logs pinchtab
          echo ""
          echo "=== All service logs ==="
          docker compose -f docker-compose.test.yml logs
      
      - name: E2E tests (stdio)
        run: node --test dist-test/tests/**/*.stdio.e2e.test.js
        env:
          PINCHTAB_MODE: external
          PINCHTAB_URL: http://127.0.0.1:19867
          PINCHTAB_TOKEN: test-token

      # E2E HTTP tests temporarily disabled - server crashes in CI environment
      # See: https://github.com/BDuba/pinchtab-mcp-wrapper/issues/TODO
      # - name: E2E tests (HTTP mode)
      #   run: MCP_TRANSPORT=streamable-http node --test dist-test/tests/**/*.http.e2e.test.js
      #   env:
      #     PINCHTAB_MODE: external
      #     PINCHTAB_URL: http://127.0.0.1:19867
      #     PINCHTAB_TOKEN: test-token
      #     MCP_HTTP_PORT: 13001
      #     MCP_AUTH_TYPE: bearer
      #     MCP_AUTH_TOKEN: mcp-test-token

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down

  test-all:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build all
        run: npm run build && npm run build:test
      
      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d
      
      - name: Check Docker containers status
        run: |
          echo "=== Docker containers status ==="
          docker ps -a
          echo ""
          echo "=== Docker compose services ==="
          docker compose -f docker-compose.test.yml ps
      
      - name: Wait for Pinchtab
        run: |
          echo "Waiting for Pinchtab to be ready..."
          for i in {1..60}; do
            if curl -s -H "Authorization: Bearer test-token" http://127.0.0.1:19867/health | grep -q '"status":"ok"'; then
              echo "Pinchtab is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - waiting..."
            sleep 1
          done
          echo "Timeout waiting for Pinchtab"
          echo ""
          echo "=== Docker diagnostics on failure ==="
          echo "=== Docker compose logs ==="
          docker compose -f docker-compose.test.yml logs
          echo ""
          echo "=== Docker containers status ==="
          docker ps -a
          exit 1
      
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Pinchtab service logs ==="
          docker compose -f docker-compose.test.yml logs pinchtab
          echo ""
          echo "=== All service logs ==="
          docker compose -f docker-compose.test.yml logs
      
      - name: Run all unit tests
        run: npm run test:unit
      
      - name: Run integration tests (stdio)
        run: node --test dist-test/tests/integration/pinchtab.integration.test.js
        env:
          PINCHTAB_URL: http://127.0.0.1:19867
          PINCHTAB_TOKEN: test-token
      
      - name: Run integration tests (HTTP)
        run: node --test dist-test/tests/integration/streamable-http.integration.test.js
        env:
          PINCHTAB_URL: http://127.0.0.1:19867
          PINCHTAB_TOKEN: test-token
          MCP_HTTP_PORT: 13000
          MCP_AUTH_TOKEN: mcp-test-token
      
      - name: Run E2E tests (stdio)
        run: node --test dist-test/tests/**/*.stdio.e2e.test.js
        env:
          PINCHTAB_MODE: external
          PINCHTAB_URL: http://127.0.0.1:19867
          PINCHTAB_TOKEN: test-token

      # E2E HTTP tests temporarily disabled - server crashes in CI
      # See issue for details
      # - name: Run E2E tests (HTTP)
      #   run: MCP_TRANSPORT=streamable-http node --test dist-test/tests/**/*.http.e2e.test.js
      #   env:
      #     PINCHTAB_MODE: external
      #     PINCHTAB_URL: http://127.0.0.1:19867
      #     PINCHTAB_TOKEN: test-token
      #     MCP_HTTP_PORT: 13001
      #     MCP_AUTH_TYPE: bearer
      #     MCP_AUTH_TOKEN: mcp-test-token
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            dist/
            dist-test/
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build, integration, integration-http]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create release tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "${{ steps.get_version.outputs.tag }}" -m "Release ${{ steps.get_version.outputs.tag }}"
          git push origin "${{ steps.get_version.outputs.tag }}"
      
      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          body: |
            ## Release ${{ steps.get_version.outputs.tag }}
            
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
